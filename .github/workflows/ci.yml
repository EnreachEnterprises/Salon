name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Installs from the repo root: the workspaces share one lockfile and
      # installing inside apps/mobile fails.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Business logic lives in packages/shared (vitest). The mobile app has no
      # unit-test script on purpose; its flows are covered by Maestro later.
      - name: Test
        run: npm test
